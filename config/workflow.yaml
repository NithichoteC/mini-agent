# Tool agent.  Run:  python main.py config/workflow.yaml "your task"
name: tool-agent

llm:
  provider: groq
  model: qwen/qwen3.8-27b
  temperature: 0.2
  max_completion_tokens: 4096

sandbox:
  dir: sandbox
  timeout_sec: 10          # kill a run_python call after this many seconds
  max_output_chars: 4000   # truncate tool output before it goes back to the model

loop:
  max_runs: 8              # one action per run; hard cap before asking the human

# Remove a line to take that ability away from the agent. final_answer is always available.
tools:
  - write_file
  - read_file
  - list_files
  - run_python
  - http_get

# Ask the person running the script for y/n before these tools execute. A "no" is sent
# back to the model as an observation, so it can try another way.
confirm: []

prompts:
  system: |
    You are a small agent working inside one folder (the workspace).
    Each turn: think briefly, then reply with exactly ONE ```json block of the form
    {"tool": "<name>", "args": {...}}
    Tools:
    {tools}
    Verify your own work with the tools (run_python, read_file) before calling final_answer.
    Never claim you created, ran or fetched something unless a tool observation shows it.
    Never repeat an action with the same arguments; if an action failed, change something,
    and if the task is impossible with the tools you have, say so in final_answer.
    File paths are relative to the workspace. No pip installs, no input().

steps:
  - id: act
    type: act
    prompt: |
      Task: {task}
    retry_prompt: |
      Observation:
      {observation}

      Next action.

  - id: review
    type: llm
    when: answered           # only after the agent called final_answer
    save_as: review
    prompt: |
      The agent says the task is complete. Its answer: {answer}

      Workspace contents:
      {files}

      Judge against the task "{task}". Reply on the first line with exactly one of:
      "VERDICT: PASS"    the workspace/answer really contains the requested result
      "VERDICT: BLOCKED" the agent says the task is impossible with its tools, and that is true
      "VERDICT: FAIL"    anything else; then say what is missing so the agent can continue

  - id: check
    type: stop_if
    when: review_pass

  - id: blocked
    type: stop_if
    when: review_blocked
    status: blocked          # main.py asks the person for help, same as running out of budget
